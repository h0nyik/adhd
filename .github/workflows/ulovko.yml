name: ulovko

on:
  push:
    paths: ["ulovko/**", ".github/workflows/ulovko.yml"]
  pull_request:
    paths: ["ulovko/**", ".github/workflows/ulovko.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ulovko
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
      - name: Design tokeny jsou aktuální
        run: node design/tokens/generate.mjs --check
      - name: Testy (jádro, tokeny, API)
        run: ./gradlew check --console=plain
